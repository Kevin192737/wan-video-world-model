<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="430" viewBox="0 0 1040 430">
  <defs>
    <marker id="arrPur" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6B4C9A"/>
    </marker>
    <marker id="arrGrn" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2E8B57"/>
    </marker>
    <marker id="arrFade" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#C8C8C8"/>
    </marker>
  </defs>

  <rect width="1040" height="430" fill="#FAFAFA"/>

  <text x="520" y="28" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#222">
    Future Action Head: P16 + V50 -&gt; A51 (Wan2.2-style layout)
  </text>

  <g id="expertPast">
    <rect x="-22" y="-14" width="44" height="28" rx="3" fill="#F3E8FF" stroke="#6B4C9A" stroke-width="2"/>
    <rect x="-14" y="-8" width="8" height="16" fill="#D4B8E8"/>
    <rect x="-2" y="-8" width="8" height="16" fill="#D4B8E8"/>
    <rect x="6" y="-8" width="8" height="16" fill="#D4B8E8"/>
  </g>
  <g id="expertVid">
    <rect x="-22" y="-14" width="44" height="28" rx="3" fill="#E8F5E9" stroke="#2E8B57" stroke-width="2"/>
    <rect x="-14" y="-8" width="8" height="16" fill="#B8DDB8"/>
    <rect x="-2" y="-8" width="8" height="16" fill="#B8DDB8"/>
    <rect x="6" y="-8" width="8" height="16" fill="#B8DDB8"/>
  </g>

  <text x="245" y="58" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#444">
    (a) Past trajectory encoding
  </text>

  <g transform="translate(0,78)">
    <circle cx="42" cy="110" r="22" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="42" y="106" text-anchor="middle" font-family="Times New Roman, serif" font-size="13" fill="#0D47A1">P<tspan baseline-shift="sub" font-size="10">16</tspan></text>
    <text x="42" y="120" text-anchor="middle" font-family="Arial" font-size="8" fill="#1565C0">past action</text>

    <circle cx="400" cy="110" r="22" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="400" y="108" text-anchor="middle" font-family="Times New Roman, serif" font-size="13" fill="#0D47A1">h<tspan baseline-shift="sub" font-size="10">p</tspan></text>
    <text x="400" y="120" text-anchor="middle" font-family="Arial" font-size="8" fill="#1565C0">summary</text>

    <rect x="95" y="55" width="250" height="110" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="220" y="48" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">Future Action Head</text>

    <g transform="translate(180,110)">
      <use href="#expertPast"/>
    </g>
    <text x="180" y="138" text-anchor="middle" font-family="Arial" font-size="9" fill="#6B4C9A" font-weight="bold">Past Encoder</text>
    <text x="180" y="150" text-anchor="middle" font-family="Arial" font-size="8" fill="#555">Linear + GRU</text>

    <line x1="64" y1="110" x2="148" y2="110" stroke="#6B4C9A" stroke-width="2.5" marker-end="url(#arrPur)"/>
    <line x1="212" y1="110" x2="378" y2="110" stroke="#6B4C9A" stroke-width="2.5" marker-end="url(#arrPur)"/>

    <circle cx="42" cy="200" r="20" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1.5"/>
    <text x="42" y="196" text-anchor="middle" font-family="Times New Roman, serif" font-size="11" fill="#9E9E9E">V<tspan baseline-shift="sub" font-size="9">50</tspan></text>
    <text x="42" y="206" text-anchor="middle" font-family="Arial" font-size="7" fill="#9E9E9E">video</text>

    <g transform="translate(180,200)" opacity="0.35">
      <use href="#expertVid"/>
    </g>
    <text x="180" y="228" text-anchor="middle" font-family="Arial" font-size="9" fill="#9E9E9E">Video Encoder</text>
    <text x="180" y="238" text-anchor="middle" font-family="Arial" font-size="7" fill="#9E9E9E">ResNet18 + GRU</text>

    <line x1="64" y1="200" x2="148" y2="200" stroke="#D0D0D0" stroke-width="2" marker-end="url(#arrFade)"/>
    <line x1="212" y1="200" x2="320" y2="200" stroke="#D0D0D0" stroke-width="2" marker-end="url(#arrFade)"/>
  </g>

  <text x="765" y="58" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#444">
    (b) Video conditioning and readout
  </text>

  <g transform="translate(490,78)">
    <rect x="95" y="55" width="360" height="165" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="275" y="48" text-anchor="middle" font-family="Arial" font-size="11" fill="#333">Future Action Head</text>

    <circle cx="42" cy="95" r="20" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1.5"/>
    <text x="42" y="92" text-anchor="middle" font-family="Times New Roman, serif" font-size="11" fill="#9E9E9E">P<tspan baseline-shift="sub" font-size="9">16</tspan></text>

    <g transform="translate(160,95)" opacity="0.35">
      <use href="#expertPast"/>
    </g>
    <text x="160" y="123" text-anchor="middle" font-family="Arial" font-size="9" fill="#9E9E9E">Past Encoder</text>

    <line x1="62" y1="95" x2="128" y2="95" stroke="#D0D0D0" stroke-width="2" marker-end="url(#arrFade)"/>

    <circle cx="250" cy="95" r="18" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1.5"/>
    <text x="250" y="99" text-anchor="middle" font-family="Times New Roman, serif" font-size="11" fill="#9E9E9E">h<tspan baseline-shift="sub" font-size="9">p</tspan></text>

    <line x1="192" y1="95" x2="232" y2="95" stroke="#D0D0D0" stroke-width="2" marker-end="url(#arrFade)"/>

    <circle cx="42" cy="185" r="22" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
    <text x="42" y="181" text-anchor="middle" font-family="Times New Roman, serif" font-size="13" fill="#1B5E20">V<tspan baseline-shift="sub" font-size="10">50</tspan></text>
    <text x="42" y="192" text-anchor="middle" font-family="Arial" font-size="8" fill="#2E7D32">future video</text>

    <g transform="translate(175,185)">
      <use href="#expertVid"/>
    </g>
    <text x="175" y="213" text-anchor="middle" font-family="Arial" font-size="9" fill="#2E8B57" font-weight="bold">Video Encoder</text>
    <text x="175" y="224" text-anchor="middle" font-family="Arial" font-size="8" fill="#555">ResNet18 + GRU</text>

    <line x1="64" y1="185" x2="141" y2="185" stroke="#2E8B57" stroke-width="2.5" marker-end="url(#arrGrn)"/>
    <line x1="209" y1="185" x2="268" y2="185" stroke="#2E8B57" stroke-width="2.5" marker-end="url(#arrGrn)"/>

    <rect x="268" y="165" width="70" height="40" rx="4" fill="#FFFDE7" stroke="#F9A825" stroke-width="1.5"/>
    <text x="303" y="182" text-anchor="middle" font-family="Arial" font-size="9" fill="#F57F17" font-weight="bold">Memory</text>
    <text x="303" y="194" text-anchor="middle" font-family="Arial" font-size="7" fill="#795548">concat(h_p, H_vid)</text>

    <line x1="268" y1="95" x2="303" y2="165" stroke="#D0D0D0" stroke-width="1.5" stroke-dasharray="4,3"/>
    <line x1="238" y1="185" x2="268" y2="185" stroke="#2E8B57" stroke-width="2.5"/>
    <line x1="303" y1="185" x2="338" y2="185" stroke="#2E8B57" stroke-width="2.5" marker-end="url(#arrGrn)"/>

    <rect x="338" y="160" width="100" height="50" rx="4" fill="#E8F5E9" stroke="#2E8B57" stroke-width="2"/>
    <text x="388" y="180" text-anchor="middle" font-family="Arial" font-size="9" fill="#1B5E20" font-weight="bold">Cross-Attn</text>
    <text x="388" y="192" text-anchor="middle" font-family="Arial" font-size="8" fill="#333">+ FFN + Head</text>
    <text x="388" y="203" text-anchor="middle" font-family="Arial" font-size="7" fill="#555">learned queries</text>

    <line x1="438" y1="185" x2="478" y2="185" stroke="#2E8B57" stroke-width="2.5" marker-end="url(#arrGrn)"/>

    <circle cx="510" cy="185" r="24" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
    <text x="510" y="182" text-anchor="middle" font-family="Times New Roman, serif" font-size="13" fill="#0D47A1">A<tspan baseline-shift="sub" font-size="10">51</tspan></text>
    <text x="510" y="194" text-anchor="middle" font-family="Arial" font-size="8" fill="#1565C0">pred. future action</text>
  </g>

  <text x="520" y="412" text-anchor="middle" font-family="Arial" font-size="10" fill="#666">
    Purple = past branch (active in a); Green = video + readout (active in b); Gray = inactive path (MoE-style fading).
  </text>
</svg>
